# Pipeline do Logstash: lê o arquivo JSON Lines gravado pelo coletor e envia cada evento ao Elasticsearch.
# Ambiente local didático para demonstração e desenvolvimento, não destinado à produção.

input {
  file {
    # runtime/logs/ do projeto, montado somente leitura (ver docker-compose.yml)
    path => "/usr/share/logstash/eventos/eventos.jsonl"
    mode => "tail"
    start_position => "beginning"
    # Guarda até onde o arquivo já foi lido (runtime/state/logstash/ no projeto)
    sincedb_path => "/usr/share/logstash/sincedb/eventos.sincedb"
    # O input file já separa as linhas; cada linha é um objeto JSON, por isso o codec é json (e não json_lines)
    codec => json
  }
}

filter {
  # Remove campos técnicos acrescentados pelo próprio Logstash, que não interessam à análise
  mutate {
    remove_field => ["@version", "[event][original]", "[log][file]", "[host][name]"]
  }
}

output {
  if "_jsonparsefailure" in [tags] {
    # Linha que não é JSON válido: aparece no log do Logstash e não vai para o índice
    stdout { codec => rubydebug }
  } else {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "windows-events"
      # ID estável gerado pelo coletor: reler o arquivo não cria documentos duplicados
      document_id => "%{[event][id]}"
      # Tipos dos campos definidos em logstash/windows-events-template.json
      manage_template => true
      template => "/usr/share/logstash/templates/windows-events-template.json"
      template_name => "windows-events"
      template_overwrite => true
      ilm_enabled => false
      data_stream => false
    }
  }
}
