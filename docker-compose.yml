# Ambiente local didático para demonstração e desenvolvimento, não destinado à produção.
#
# Uso normal (Windows): scripts\iniciar_demo.ps1 e scripts\parar_demo.ps1 (ver README).
# Status:   docker compose ps          (aguarde "healthy" nos serviços)
# Desligar: docker compose stop        (mantém containers e dados)

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
    environment:
      - discovery.type=single-node        # um único nó, sem cluster
      - xpack.security.enabled=false      # simplificação didática: sem login e sem TLS. Nunca usar em produção.
      - ES_JAVA_OPTS=-Xms512m -Xmx512m    # limita a memória da JVM: suficiente para o volume pequeno e cabe em notebook
    ports:
      - "127.0.0.1:9200:9200"             # acessível somente a partir da própria máquina
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s'"]
      interval: 10s
      timeout: 10s
      retries: 30

  logstash:
    image: docker.elastic.co/logstash/logstash:9.5.5   # mesma versão do Elasticsearch e do Kibana
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx256m    # pipeline pequeno; valor ainda não validado no fluxo completo (ver README)
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./logstash/windows-events-template.json:/usr/share/logstash/templates/windows-events-template.json:ro
      - ./runtime/logs:/usr/share/logstash/eventos:ro      # arquivo JSONL gravado pelo coletor no Windows
      - ./runtime/state/logstash:/usr/share/logstash/sincedb  # posição de leitura do arquivo (sincedb)
    depends_on:
      elasticsearch:
        condition: service_healthy

  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.5   # mesma versão do Elasticsearch
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:5601/api/status"]
      interval: 10s
      timeout: 10s
      retries: 30

volumes:
  esdata:
